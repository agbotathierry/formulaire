<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="projet-formulaire.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="conteneur-principal">
        <div class="bloc-gauche">
            <div class="titre">
                <div class="overlay">
                    <img class="logo" src="assets/odin-lined.png" alt="logo de ODIN">
                    ODIN</div>
                    <div class="credit-photo">photo by rafeal garcin</div>
            </div>
        </div>
        <div class="bloc-droite">
            <div class="intro">
                <h1>formulaire d'inscription dans le cadre du pojet odin</h1>
            </div>
            <form action="#" method="post">
                <fieldset class="formulaire">
                    <legend>let do it!</legend>
                    <div class="paire num1">
                        <div class="champ prim1">
                           <label class="leschamps" for="prenom">Prenom</label>
                           <input class="leschamps" type="text" id="prenom" name="prenom" placeholder="thor">
                        </div>
                        <div class="champ prim2">
                            <label class="leschamps" for="nom">Nom</label>
                            <input class="leschamps" type="text" id="nom" name="nom" placeholder="odinson">
                        </div>
                    </div>
                    <div class="paire num2">
                        <div class="champ prim3">
                            <label class="leschamps" for="email">email</label>
                            <input class="leschamps" type="email" id="email" name="email" placeholder="agt@gmail.com">
                        </div>
                        <div class="champ prim4">
                            <label class="leschamps" for="phoneNomber">Phone number</label>
                            <input class="leschamps" type="tel" id="phoneNomber" name="phoneNumber">
                        </div>
                    </div>
                    <div class="paire num3">
                        <div class="champ prim5">
                            <label class="leschamps" for="pwd" >Password</label>
                            <input class="leschamps" type="password" name="password" required>
                        </div>
                        <div class="champ prim6">
                            <label class="leschamps" for="pwd">Confirm password</label>
                            <input class="leschamps" type="password" id="pwd" name="Confirm_password" required>
                        </div>
                    </div>
                </fieldset>
                <div class="bouton-validation">
                    <div class="boutton">
                        <button type="submit">Creat Acount</button>
                    </div>
                    <p>already have Acount? <a href="#">log in</a></p>
                    
                </div>
            </form>
        </div>
    </div>
</body>
</html>
